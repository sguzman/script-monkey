<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ChatGPT Tab Signal</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 272px;
      margin: 0;
      padding: 14px;
      background: #151515;
      color: #f3f3f3;
    }
    h1 { font-size: 15px; margin: 0 0 8px; }
    p { font-size: 12px; line-height: 1.4; color: #cfcfcf; margin: 0 0 12px; }
    button {
      width: 100%;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 9px 10px;
      background: #f3f3f3;
      color: #111;
      font-weight: 650;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button.secondary { background: #25354d; color: #f1f5ff; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #status { min-height: 18px; margin-top: 3px; font-size: 12px; color: #d8d8d8; }
  </style>
</head>
<body>
  <h1>ChatGPT Tab Signal</h1>
  <p>Off by default. Only the tab you explicitly enable is monitored. Other tabs are never injected.</p>
  <button id="toggle" disabled>Checking selected tab...</button>
  <button id="test" class="secondary" disabled>Test sound + notification</button>
  <button id="test-unread" class="secondary" disabled>Preview unread favicon</button>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
