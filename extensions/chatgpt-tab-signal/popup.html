<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ChatGPT Tab Signal</title>
  <style>
    body { font-family: system-ui,sans-serif; width: 260px; padding: 14px;
      margin: 0; background: #151515; color: #f3f3f3; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    p { font-size: 12px; line-height: 1.45; color: #cfcfcf; }
    button { width: 100%; padding: 10px; border: 1px solid #555;
      border-radius: 8px; cursor: pointer; font-weight: 650;
      background: #f3f3f3; color: #111; }
    button:disabled { opacity: 0.55; cursor: wait; }
    #status { min-height: 24px; margin-top: 10px; font-size: 12px; color: #d8d8d8; }
  </style>
</head>
<body>
  <h1>ChatGPT Tab Signal</h1>
  <p>One switch covers every ChatGPT tab. Idle tabs are left untouched.
     A tab is activated only when you send a message in it.</p>
  <button id="toggle" disabled>Checking...</button>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
