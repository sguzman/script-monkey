name: Jobflick Bridge
on:
  push:
    paths:
      - extensions/jobflick-bridge/**
      - .github/workflows/jobflick-bridge.yml
  pull_request:
    paths:
      - extensions/jobflick-bridge/**
      - .github/workflows/jobflick-bridge.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix extensions/jobflick-bridge test
  mv3-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disposable Chromium and Playwright
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Test real MV3 extension with synthetic tabs and native host
        run: python extensions/jobflick-bridge/tests/mv3-integration.py
