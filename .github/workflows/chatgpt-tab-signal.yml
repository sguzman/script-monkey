name: ChatGPT Tab Signal tests

on:
  push:
    paths:
      - 'extensions/chatgpt-tab-signal/**'
      - '.github/workflows/chatgpt-tab-signal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, manifest, and lifecycle simulations
        run: npm --prefix extensions/chatgpt-tab-signal test
  chromium-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Playwright Chromium
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Exercise real Chromium DOM in disposable profile
        run: python extensions/chatgpt-tab-signal/tests/chromium-isolated.py
  mv3-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Chromium (extension-capable)
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Real unpacked Manifest V3 multi-tab integration
        env:
          TAB_SIGNAL_MV3_TABS: '12'
        run: python extensions/chatgpt-tab-signal/tests/mv3-integration.py
