name: ChatGPT Tab Signal tests

on:
  push:
    paths:
      - 'extensions/chatgpt-tab-signal/**'
      - '.github/workflows/chatgpt-tab-signal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, manifest, and lifecycle simulations
        run: npm --prefix extensions/chatgpt-tab-signal test
      - name: Check isolated Edge launcher syntax and arguments
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fish
          fish --no-execute extensions/chatgpt-tab-signal/qa-isolated-edge.fish
          bash extensions/chatgpt-tab-signal/tests/qa-launcher-smoke.sh
  chromium-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Playwright Chromium
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Exercise real Chromium DOM in disposable profile
        run: python extensions/chatgpt-tab-signal/tests/chromium-isolated.py
  mv3-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Chromium (extension-capable)
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Real unpacked Manifest V3 multi-tab integration
        env:
          TAB_SIGNAL_MV3_TABS: '24'
        run: python extensions/chatgpt-tab-signal/tests/mv3-integration.py

  edge-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Microsoft Edge Stable for Linux
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps msedge
      - name: Actual Edge MV3 extension with 24 synthetic tabs
        env:
          TAB_SIGNAL_MV3_TABS: '24'
          TAB_SIGNAL_BROWSER_CHANNEL: msedge
        run: python extensions/chatgpt-tab-signal/tests/mv3-integration.py

  chrome-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Chrome for Testing (allows unpacked extensions)
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
          python extensions/chatgpt-tab-signal/tests/install-chrome-for-testing.py
      - name: Chrome for Testing MV3 extension with 24 synthetic tabs
        env:
          TAB_SIGNAL_MV3_TABS: '24'
          TAB_SIGNAL_BROWSER_CHANNEL: chrome
          TAB_SIGNAL_BROWSER_EXECUTABLE: /tmp/chatgpt-tab-signal-cft/chrome-linux64/chrome
        run: python extensions/chatgpt-tab-signal/tests/mv3-integration.py
